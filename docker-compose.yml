version: "3.9"

services:
  backend:
    build: ./backend
    container_name: brunella-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - QWEN_CODER_MODEL=${QWEN_CODER_MODEL:-qwen-coder-plus-latest}
      - QWEN_API_BASE=${QWEN_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:7b}
    
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8000/agent"
    container_name: brunella-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
