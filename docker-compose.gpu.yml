services:
  brunella_backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn agent_api:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  brunella_frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - brunella_backend

volumes:
  cache:
