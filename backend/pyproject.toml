[project]
name = "brunella-agent"
version = "0.0.1"
description = "Backend for the LangGraph agent"
authors = [
    { name = "Philipp Schmid", email = "schmidphilipp1995@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph~=0.2.6",
    "langchain~=0.3.19",
    "langchain-google-genai~=2.0.8",
    "langchain-ollama~=0.2.2",
    "python-dotenv~=1.0.1",
    "langgraph-sdk~=0.1.57",
    "langgraph-cli~=0.1.71",
    "langgraph-api~=0.0.11",
    "fastapi~=0.115.0",
    "google-genai~=0.3.0",
    "google-cloud-secret-manager~=2.21.0",
    "google-cloud-managed-identities~=1.8.8",
    "langchain-community~=0.3.19",
    "tavily-python~=0.5.0",
    "openai~=1.58.0",
    "watchfiles~=0.18.0",
    "slowapi~=0.1.9",
    "uvicorn~=0.32.0",
]


[project.optional-dependencies]
dev = ["mypy~=1.11.1", "ruff~=0.6.1", "pytest~=8.3.5", "httpx~=0.27.0"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.1.71",
    "pytest>=8.3.5",
    "httpx>=0.27.0",
]
